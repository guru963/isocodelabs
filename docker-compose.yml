# Local development database only. These credentials are not used in any deployment.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tna
      POSTGRES_PASSWORD: tna_local_dev
      POSTGRES_DB: tna
    ports:
      - "5433:5432"
    volumes:
      - tna_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tna -d tna"]
      interval: 3s
      timeout: 3s
      retries: 20

  # A cache only, so nothing is saved to disk. volatile-lru never evicts the version key,
  # which has no expiry, so old answers cannot come back when memory runs short.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "volatile-lru"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  tna_db:
