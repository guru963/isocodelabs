# Local development database only. These credentials are not used in any deployment.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tna
      POSTGRES_PASSWORD: tna_local_dev
      POSTGRES_DB: tna
    ports:
      - "5433:5432"
    volumes:
      - tna_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tna -d tna"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  tna_db:
