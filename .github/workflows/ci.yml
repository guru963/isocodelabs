name: CI

# Every push to main and every pull request runs the same checks a reviewer would run by hand.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to a pull request makes an older run pointless, so it is cancelled. Runs on main
# are left to finish, so a deploy is never cut off halfway.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  checks:
    name: Typecheck, unit tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate the Prisma client
        run: npx prisma generate
        working-directory: apps/api

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build the web app
        run: npm run build:web

      # Kept for a week, so a deploy step added later can ship exactly what was tested.
      - name: Keep the built web app
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7

  integration:
    name: Integration tests (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A throwaway database for this run only; the credentials never leave the runner.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tna
          POSTGRES_PASSWORD: tna_ci
          POSTGRES_DB: tna_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tna -d tna_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://tna:tna_ci@localhost:5432/tna_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate the Prisma client
        run: npx prisma generate
        working-directory: apps/api

      # The test setup applies the migrations, so this also checks they run cleanly from empty.
      - name: Integration tests
        run: npm run test:integration

  # Ships main to Vercel once both test jobs pass. It stays off until the Vercel project's ids
  # are saved as repository variables, so CI works before deployment is set up.
  deploy:
    name: Deploy to Vercel
    needs: [checks, integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.VERCEL_PROJECT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    # One deploy at a time; a second waits rather than racing the first.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci

      # Before the new code goes live, so it never runs against an older schema. Neon's direct
      # (unpooled) address, because migrations do not work through its connection pooler.
      - name: Apply database migrations
        run: npx prisma migrate deploy
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_UNPOOLED }}

      - name: Install the Vercel CLI
        run: npm install --global vercel@65.2.0

      - name: Fetch the project settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Check the live API answers
        if: vars.APP_URL != ''
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors "$APP_URL/api/health"
        env:
          APP_URL: ${{ vars.APP_URL }}
